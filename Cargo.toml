[workspace]
members = [
    "crates/pipedream-connect-types",
    "crates/pipedream-connect",
    "crates/pipedream-connect-webhooks",
    "crates/pipedream-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Futex"]
repository = "https://github.com/futex-ai/pipedream-connectors"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.5.0"
httpdate = "1.0.3"
internal-error = { version = "0.1.0", git = "https://github.com/futex-ai/internal-error.git", rev = "6477922a1c4db8c3e35189af69f0147464004b99", package = "internal-error" }
pipedream-connect = { version = "0.1.0", path = "crates/pipedream-connect" }
pipedream-connect-types = { version = "0.1.0", path = "crates/pipedream-connect-types" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["sync", "time"] }
tracing = "0.1.44"
unimock = "0.6.8"
url = "2.5.8"
